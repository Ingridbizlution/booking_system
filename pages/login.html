<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登入 · Offision</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../assets/css/app.css">
  <style>
    body { background: linear-gradient(135deg,#eef4ff,#fff 40%,#f4ecff); min-height:100vh; margin:0; }
    .login-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
    .login-card {
      width: min(420px, 100%);
      background:#fff; border-radius:20px; padding:32px;
      box-shadow: 0 20px 40px rgba(31,128,240,.08);
      border: 1px solid var(--off-border);
    }
    .brand-mark {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #58f5cd, #23c1a9 30%, #7c67f4 65%, #ff8fa3);
      display:inline-flex; align-items:center; justify-content:center;
      color:#fff; font-weight:700; font-size:24px; margin-bottom:16px;
    }
    .login-card h1 { font-size:22px; margin:0 0 4px; }
    .login-card p.sub { color: var(--off-text-muted); font-size:13px; margin:0 0 24px; }
    .login-card label { font-size:12px; color:#4b525f; display:block; margin:12px 0 6px; }
    .login-card input {
      width:100%; padding:10px 14px; border:1px solid var(--off-border);
      border-radius:10px; font-size:14px; outline:none;
    }
    .login-card input:focus { border-color: var(--off-primary); }
    .login-card button.primary {
      width:100%; margin-top:20px; padding:11px;
      background: var(--off-primary); color:#fff; border:0;
      border-radius:10px; font-size:14px; font-weight:600; cursor:pointer;
    }
    .login-card button.primary:disabled { opacity:.6; cursor:not-allowed; }
    .login-card .err { color: var(--off-red); font-size:13px; margin-top:12px; }
    .hint {
      margin-top:20px; padding:12px 14px; background:#f4f6fa;
      border-radius:10px; font-size:12px; color:#4b525f;
    }
    .hint code { background:#fff; padding:1px 6px; border-radius:4px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">
        <svg viewBox="0 0 40 40" width="36" height="36" xmlns="http://www.w3.org/2000/svg">
          <rect x="4"  y="4"  width="14" height="14" rx="3" fill="#fff" opacity=".95"/>
          <rect x="22" y="4"  width="14" height="14" rx="3" fill="#fff" opacity=".8"/>
          <rect x="4"  y="22" width="14" height="14" rx="3" fill="#fff" opacity=".8"/>
          <rect x="22" y="22" width="14" height="14" rx="3" fill="#fff" opacity=".95"/>
        </svg>
      </div>
      <h1>登入 Offision</h1>
      <p class="sub">請使用您的組織帳號登入</p>

      <form id="login-form" autocomplete="off">
        <label for="email">電子郵件</label>
        <input id="email" type="email" required value="ingrid@bizlution.com">

        <label for="pw">密碼</label>
        <input id="pw" type="password" required value="Ingrid1234!">

        <button class="primary" id="submit-btn" type="submit">登入</button>
        <div class="err" id="err" style="display:none"></div>
      </form>

      <div class="hint">
        <b>Demo 帳號</b><br>
        Admin：<code>ingrid@bizlution.com / Ingrid1234!</code><br>
        Staff：<code>m0341018@mail.hfu.edu.tw / Support1234!</code><br>
        User：<code>ingridiaim@gmail.com / User1234!</code>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script>
    // 已登入直接進 launcher
    if (OffAuth.token()) location.href = 'launcher.html';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('err');
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = '登入中…';
      try {
        const tok = await OffAPI.login(document.getElementById('email').value, document.getElementById('pw').value);
        OffAuth.save(tok);
        const next = new URLSearchParams(location.search).get('next') || 'launcher.html';
        location.href = next;
      } catch (ex) {
        err.textContent = ex.message || '登入失敗';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = '登入';
      }
    });
  </script>
</body>
</html>
