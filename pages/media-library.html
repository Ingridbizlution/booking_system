<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>系統 · 媒體庫 · Offision</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-module="system" data-page="media"
      data-crumbs='[{"label":"系統","href":"system-audit.html"},{"label":"媒體庫"}]'>

  <div id="off-top"></div>
  <div class="off-shell">
    <div id="off-sidebar"></div>
    <main class="off-main">
      <div class="off-page-head">
        <span class="off-page-icon" style="background:linear-gradient(135deg,#a5b3c3,#5b6472)"><i class="ti ti-folder"></i></span>
        <div>
          <div class="off-page-title-row">
            <h1>媒體庫</h1>
            <button class="off-btn off-btn-primary"><i class="ti ti-upload"></i> 上傳</button>
          </div>
          <p class="off-page-desc">跨模組共用的圖片與影片；支援標籤、資料夾、預覽與批次刪除</p>
        </div>
        <div class="off-page-actions">
          <button class="off-filter-pill">所有資料夾 <i class="ti ti-chevron-down"></i></button>
          <button class="off-filter-pill">所有標籤 <i class="ti ti-chevron-down"></i></button>
        </div>
      </div>

      <div class="off-grid cols-4">
        <div class="off-panel" style="padding:0; overflow:hidden">
          <div style="height:120px; background:linear-gradient(135deg,#dce7f5,#a9c3e6)"></div>
          <div style="padding:12px"><b style="font-size:13px">lobby-welcome.png</b><br><small style="color:var(--off-text-muted)">PNG · 1.2 MB · 大廳</small></div>
        </div>
        <div class="off-panel" style="padding:0; overflow:hidden">
          <div style="height:120px; background:linear-gradient(135deg,#f7d3d8,#e75d84)"></div>
          <div style="padding:12px"><b style="font-size:13px">event-banner.jpg</b><br><small style="color:var(--off-text-muted)">JPG · 800 KB · 活動</small></div>
        </div>
        <div class="off-panel" style="padding:0; overflow:hidden">
          <div style="height:120px; background:linear-gradient(135deg,#fdeac2,#f39c3d)"></div>
          <div style="padding:12px"><b style="font-size:13px">safety-video.mp4</b><br><small style="color:var(--off-text-muted)">MP4 · 24 MB · 安全</small></div>
        </div>
        <div class="off-panel" style="padding:0; overflow:hidden">
          <div style="height:120px; background:linear-gradient(135deg,#d0f2e6,#12a97e)"></div>
          <div style="padding:12px"><b style="font-size:13px">floor-plan-1F.svg</b><br><small style="color:var(--off-text-muted)">SVG · 40 KB · 地圖</small></div>
        </div>
        <div class="off-panel" style="padding:0; overflow:hidden">
          <div style="height:120px; background:linear-gradient(135deg,#e0d5ff,#7c67f4)"></div>
          <div style="padding:12px"><b style="font-size:13px">logo-dark.png</b><br><small style="color:var(--off-text-muted)">PNG · 90 KB · 品牌</small></div>
        </div>
        <div class="off-panel" style="padding:0; overflow:hidden">
          <div style="height:120px; background:linear-gradient(135deg,#eef1f6,#c9d5e3)"></div>
          <div style="padding:12px"><b style="font-size:13px">meeting-hero.jpg</b><br><small style="color:var(--off-text-muted)">JPG · 1.6 MB · 會議室</small></div>
        </div>
      </div>
    </main>
  </div>
  <script src="../assets/js/app.js"></script>
</body>
</html>
