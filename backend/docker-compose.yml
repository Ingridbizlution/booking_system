services:
  db:
    image: postgres:16-alpine
    container_name: offision-db
    environment:
      POSTGRES_USER: offision
      POSTGRES_PASSWORD: offision
      POSTGRES_DB: offision
    ports:
      - "5433:5432"
    volumes:
      - offision_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offision -d offision"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: offision-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://offision:offision@db:5432/offision
      JWT_SECRET: change-me-in-production-please
      JWT_ALGORITHM: HS256
      JWT_EXPIRES_MIN: "480"
      CORS_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000,http://localhost:8001,http://127.0.0.1:8001,http://localhost:5500,https://ingridbizlution.github.io"
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app/app
    command: >
      sh -c "python -m app.db.init_db && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"

volumes:
  offision_pgdata:
